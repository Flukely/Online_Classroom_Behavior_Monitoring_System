<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Detection App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Face Detection App</h1>
        <div class="upload-section">
            <input type="file" id="videoUpload" accept="video/*">
        </div>
        <div class="loader" id="loader"></div>
        <div class="video-container">
            <video id="myVideo" autoplay muted></video>
            <input type="range" id="videoProgress" min="0" value="0" step="0.01" style="width:100%;">
            <div style="display:flex;justify-content:space-between;font-size:14px;color:#fff;margin-top:2px;">
                <span id="currentTime">00:00</span>
                <span id="totalTime">00:00</span>
            </div>
        </div>
        <div class="charts-container">
            <div class="chart-wrapper">
                <canvas id="emotionLineChart"></canvas>
            </div>
            <div class="chart-wrapper">
                <canvas id="emotionPieChart"></canvas>
            </div>
        </div>
        <button id="reloadChartBtn">Refresh Chart</button>
        <button id="clearCsvBtn" style="background:#e74c3c;color:#fff;">ล้างข้อมูล</button>
        <div id="snapshotContainer"></div>
    </div>
    <script src="face-api.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
</body>
</html>
